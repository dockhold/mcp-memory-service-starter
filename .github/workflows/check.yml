name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Build the image
        run: docker build -t mcp-memory-service-starter:test .
      - name: Image size
        # The README says the free plan is enough. Print the number that claim
        # rests on, and fail when an upgrade pushes the image past the free
        # plan's image size (FREE_IMAGE_BYTES, as published in
        # https://dockhold.eu/llms.txt on 2026-09-27). docker image inspect
        # reports the uncompressed size; the gzip of a docker save is a close
        # estimate of the compressed size a registry sees.
        env:
          FREE_IMAGE_BYTES: "300000000"
        run: |
          uncompressed=$(docker image inspect mcp-memory-service-starter:test --format '{{.Size}}')
          compressed=$(docker save mcp-memory-service-starter:test | gzip -9 | wc -c)
          echo "uncompressed: $((uncompressed / 1048576)) MiB ($uncompressed bytes)"
          echo "compressed (docker save | gzip -9): $((compressed / 1048576)) MiB ($compressed bytes)"
          if [ "$compressed" -gt "$FREE_IMAGE_BYTES" ]; then
            echo "::error::compressed image is over FREE_IMAGE_BYTES; the README's free-plan line is no longer true"
            exit 1
          fi
      - name: Smoke test
        run: tests/smoke.sh mcp-memory-service-starter:test
